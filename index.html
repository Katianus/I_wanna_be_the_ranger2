const sheetImg=new Image();sheetImg.src=spriteSheetSrc;
// Sprite-sheet source rectangles (Idle, Walk Fangames, Walk Fixed, Walk Bugged, Prepare Jump, Jump, Fall)
const animFrames={
 idle:[[18,34,54,52],[73,34,54,52],[128,34,54,52],[183,34,53,52]],
 fangames:[[18,88,54,53],[73,88,54,53],[128,88,54,53],[183,88,53,53]],
 fixed:[[18,143,54,52],[73,143,54,52],[128,143,54,52],[183,143,53,52],[237,143,53,52],[291,143,53,52]],
 bugged:[[18,197,54,52],[73,197,54,52]],
 prepare:[[18,251,54,53],[73,251,54,53]],
 jump:[[18,306,54,52],[73,306,54,52]],
 fall:[[18,360,54,51],[73,360,54,51]]};
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const keys={left:false,right:false,jump:false};let mode='title',world=0,cam=0,player={x:50,y:0,vx:0,vy:0,w:22,h:30,onGround:false,dir:1,anim:0,jumpPrep:0};let lockTimer=0;let lagUntil=0,nextGlitch=0,glitchMsg='[FRAME DROP...]';const lagOverlay=document.getElementById('lag');
const platforms=[ [0,315,360,45],[400,282,130,18],[575,250,105,18],[740,300,180,20],[970,260,140,18],[1170,315,220,30],[1480,290,160,18],[1700,250,150,18],[1930,315,250,40],[2240,270,140,18],[2460,220,150,18],[2720,315,280,40],[3080,295,140,18],[3300,315,240,40] ];
function start(){mode='play';player.x=55;player.y=240;player.vx=0;player.vy=0;cam=0;world=0;}
function drawText(text,x,y,size=18,color='#fff'){ctx.font='bold '+size+'px monospace';ctx.fillStyle=color;ctx.fillText(text,x,y);}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.floor(x),Math.floor(y),w,h)}
function bg(){let kingdom=player.x>1850;rect(0,0,640,360,kingdom?'#323044':'#77b8d8');if(kingdom){rect(0,260,640,100,'#29252f');for(let i=0;i<7;i++){let x=i*110-(cam*.2%110);rect(x,100,72,170,'#4b4654');rect(x+14,120,18,25,'#f0b75a');rect(x+40,120,18,25,'#f0b75a');rect(x+20,170,30,55,'#24222a');}rect(470,65,140,200,'#3b3447');rect(490,45,100,35,'#5b4d62');drawText('THE KINGDOM',430,32,14,'#c5b7d8');}
else{rect(0,255,640,105,'#67a34e');rect(0,290,640,70,'#3f773d');for(let i=0;i<9;i++){let x=i*120-(cam*.35%120);rect(x+20,170,70,90,'#b7774c');rect(x+10,160,90,22,'#6e4839');rect(x+32,190,18,20,'#e8c16a');rect(x+62,190,18,20,'#e8c16a');rect(x+45,220,25,40,'#554036');rect(x+5,245,35,20,'#3d8c4a');rect(x+90,230,40,35,'#3d8c4a');}drawText('VILLAGE OUTSKIRTS',14,24,12,'#e7f6ff');}
// clouds
for(let i=0;i<4;i++){let cx=(i*190-(cam*.12)%760+800)%760-80;rect(cx,65,48,15,'#e4eef0');rect(cx+14,53,38,20,'#e4eef0');}
}
function ninja(x,y){rect(x,y,18,24,'#a62b35');rect(x+3,y+5,12,7,'#27232b');rect(x+4,y+7,10,2,'#ece5db');rect(x+5,y+15,8,8,'#5b362b');rect(x-2,y+3,22,4,'#77222b');}
let walkStyle='fangames';const walkStyles=['fangames','fixed','bugged'];
function drawPlayer(){
 if(!sheetImg.complete||!sheetImg.naturalWidth){rect(player.x-cam,player.y,20,28,'#2c4c90');return;}
 let state='idle';if(player.jumpPrep>0)state='prepare';else if(!player.onGround)state=player.vy<0?'jump':'fall';else if(Math.abs(player.vx)>0.01)state=walkStyle;
 const list=animFrames[state]||animFrames.idle;let frameIndex=0;
 if(state==='idle')frameIndex=Math.floor(player.anim/12)%list.length;
 else if(state==='prepare')frameIndex=Math.floor((80-player.jumpPrep)/40)%list.length;
 else frameIndex=Math.floor(player.anim/8)%list.length;
 const [sx,sy,sw,sh]=list[frameIndex];ctx.save();if(player.dir<0){ctx.translate(player.x-cam+55,player.y-18);ctx.scale(-1,1);ctx.drawImage(sheetImg,sx,sy,sw,sh,0,0,55,54);}else ctx.drawImage(sheetImg,sx,sy,sw,sh,player.x-cam-16,player.y-18,55,54);ctx.restore();
}
function update(){if(mode!=='play')return;let speed=2.4;if(Date.now()<lagUntil)return;if(Date.now()>nextGlitch){const r=Math.random();lagUntil=Date.now()+(r<.55?420:650);nextGlitch=Date.now()+8500+Math.random()*9500;glitchMsg=r<.55?'[FRAME DROP...]':r<.8?'INPUT BUFFERING...':'VIDEO SIGNAL LOST';lagOverlay.textContent=glitchMsg;lagOverlay.style.display='block';setTimeout(()=>{if(Date.now()>=lagUntil)lagOverlay.style.display='none';},700);if(r>.75){player.x+=Math.random()*18-9;player.y+=Math.random()*8-4;}} player.vx=(keys.left?-speed:0)+(keys.right?speed:0);if(player.vx)player.dir=player.vx>0?1:-1;player.x+=player.vx;player.vy+=.42;player.vy=Math.min(player.vy,9);player.y+=player.vy;player.onGround=false;
for(const p of platforms){let [x,y,w,h]=p;if(player.x+player.w>x&&player.x<x+w&&player.y+player.h>=y&&player.y+player.h<=y+Math.max(12,player.vy+3)&&player.vy>=0){player.y=y-player.h;player.vy=0;player.onGround=true;}}
player.anim+=Math.abs(player.vx)*.16+0.6;if(player.jumpPrep>0)player.jumpPrep=Math.max(0,player.jumpPrep-1);if(player.y>400){if(player.x>1850){mode='softlock';lockTimer=0;}else{player.x=player.x<1000?60:1160;player.y=240;player.vy=0;}}
cam=Math.max(0,Math.min(3300,player.x-250));if(player.x>1860&&player.x<1875)world=1;if(player.x>3450){mode='end';}
}
function render(){ctx.clearRect(0,0,640,360);bg();if(mode==='title'){drawText('I WANNA BE THE RANGER 2',45,115,25,'#fff');drawText('LOST BUILD / DEV 0.0.3',130,155,14,'#c9c9c9');drawText('PRESS ENTER',230,255,20,'#f4df87');drawText('prototype test stage',192,292,12,'#999');drawText('WALK STYLE: 1 FANGAMES / 2 FIXED / 3 BUGGED',65,320,11,'#bbb');return;}
for(const p of platforms){let [x,y,w,h]=p;rect(x-cam,y,w,h,'#514e4d');rect(x-cam,y,w,4,'#9b8e82');}if(player.x<1850){for(let n=0;n<5;n++){let nx=390+n*320;if(Math.abs(nx-player.x)<620)ninja(nx-cam,283);}}else{for(let n=0;n<4;n++){let nx=2100+n*350;if(Math.abs(nx-player.x)<620)ninja(nx-cam,283);}}
// unfinished door/sign in kingdom
if(player.x>1800){rect(3380-cam,190,44,125,'#77716a');rect(3390-cam,205,24,110,'#201d26');drawText('END?',3370-cam,178,14,'#ffde77');}
drawPlayer();drawText(player.x>1850?'KINGDOM - TEST AREA':'VILLAGE / OUTSKIRTS',12,20,12,'#fff');if(mode==='softlock'){rect(0,0,640,360,'rgba(0,0,0,.72)');drawText('ERROR: RESPAWN NOT FOUND',55,155,18,'#c8c8c8');drawText('the build stopped responding here',66,185,12,'#888');return;}if(mode==='end'){rect(0,0,640,360,'rgba(0,0,0,.85)');drawText('CONGRATULATIONS!',155,130,26,'#fff');drawText('stage clear function not found',120,172,14,'#aaa');drawText('press ENTER to return',175,235,15,'#ddd');}}
function loop(){update();render();if(Date.now()<lagUntil&&mode==='play'){lagOverlay.style.display='block';}else if(Date.now()>=lagUntil){lagOverlay.style.display='none';}requestAnimationFrame(loop);}loop();
function keyDown(e){let k=e.key.toLowerCase();if(k==='1')walkStyle='fangames';if(k==='2')walkStyle='fixed';if(k==='3')walkStyle='bugged';if(['arrowleft','arrowright','arrowup',' '].includes(k))e.preventDefault();if(k==='a'||k==='arrowleft')keys.left=true;if(k==='d'||k==='arrowright')keys.right=true;if((k===' '||k==='arrowup'||k==='w')&&!keys.jump){keys.jump=true;if(mode==='title'){start();}else if(mode==='play'&&player.onGround){player.jumpPrep=8;player.vy=-8.8;player.onGround=false;}}if(k==='enter'){if(mode==='title')start();else if(mode==='end')start();}}
function keyUp(e){let k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keys.left=false;if(k==='d'||k==='arrowright')keys.right=false;if(k===' '||k==='arrowup'||k==='w')keys.jump=false;}
window.addEventListener('keydown',keyDown);window.addEventListener('keyup',keyUp);document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key;const down=e=>{e.preventDefault();if(k==='left')keys.left=true;if(k==='right')keys.right=true;if(k==='jump'&&!keys.jump){keys.jump=true;if(mode==='title')start();else if(mode==='play'&&player.onGround){player.jumpPrep=8;player.vy=-8.8;player.onGround=false;}}};const up=e=>{e.preventDefault();if(k==='left')keys.left=false;if(k==='right')keys.right=false;if(k==='jump')keys.jump=false;};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointerleave',up);btn.addEventListener('pointercancel',up);});
</script></body></html>
